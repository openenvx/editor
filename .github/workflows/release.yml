name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump for published editor packages
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      skip_bump:
        description: Skip version/changelog/tag and publish the current package versions (retry a failed publish)
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Version, publish, and release
    runs-on: ubuntu-latest
    # Release commits are machine-made; the dev pre-commit hook must not gate them.
    env:
      HUSKY: '0'
      PUBLISHED_PACKAGES: >-
        packages/studio packages/canvas-driver packages/html-driver packages/email-driver packages/editor-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure current npm CLI
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute next version
        id: version
        run: |
          if [ "${{ inputs.skip_bump }}" = "true" ]; then
            VERSION=$(bun -e "console.log(require('./packages/studio/package.json').version)")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Publishing package.json version (skip_bump): $VERSION"
            exit 0
          fi
          BUMP="${{ inputs.bump }}"
          VERSION=$(bun -e "
            const { execSync } = require('node:child_process');
            const bump = process.argv[1];
            const bumpSemver = (version, kind) => {
              const [maj, min, patch] = version.split('.').map(Number);
              if (kind === 'major') return \`\${maj + 1}.0.0\`;
              if (kind === 'minor') return \`\${maj}.\${min + 1}.0\`;
              return \`\${maj}.\${min}.\${patch + 1}\`;
            };
            const latestTag = execSync(\"git tag -l 'v[0-9]*' --sort=-v:refname\", { encoding: 'utf8' })
              .trim()
              .split(/\\n/)
              .filter(Boolean)[0];
            if (!latestTag) {
              console.log(require('./packages/studio/package.json').version);
              process.exit(0);
            }
            const latestVersion = latestTag.replace(/^v/, '');
            let raw = execSync(\`bunx git-cliff --bump \${bump} --bumped-version\`, { encoding: 'utf8' }).trim();
            let version = raw.replace(/^v/, '');
            if (version === latestVersion) {
              version = bumpSemver(latestVersion, bump);
              console.error(
                \`git-cliff reported no unreleased commits (stayed at \${latestVersion}); manual release bump -> \${version}\`,
              );
            }
            console.log(version);
          " "$BUMP")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $VERSION"

      - name: Bump published package versions
        if: ${{ !inputs.skip_bump }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for pkg in $PUBLISHED_PACKAGES; do
            bun -e "
              const fs = require('node:fs');
              const path = process.argv[1];
              const version = process.argv[2];
              const file = path + '/package.json';
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            " "$pkg" "$VERSION"
          done

      - name: Update changelog
        if: ${{ !inputs.skip_bump }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          bunx git-cliff --tag "v$VERSION" -o CHANGELOG.md

      - name: Build published packages
        run: |
          bun run build --filter=@openenvx/studio --filter=@openenvx/canvas-driver --filter=@openenvx/html-driver --filter=@openenvx/email-driver --filter=@openenvx/editor-sandbox

      - name: Lint and type check
        run: bun run check && bun run check-types

      - name: Test
        run: bun run test

      - name: Smoke Next and Vite consumers
        run: bun run smoke-next-consumer

      - name: Verify package repository metadata
        run: |
          EXPECTED="git+https://github.com/${{ github.repository }}.git"
          for pkg in $PUBLISHED_PACKAGES; do
            REPO_URL=$(bun -e "console.log(require('./$pkg/package.json').repository.url)")
            if [ "$REPO_URL" != "$EXPECTED" ]; then
              echo "ERROR: $pkg repository.url is '$REPO_URL', expected '$EXPECTED'"
              exit 1
            fi
          done

      - name: Commit version bump and tag
        if: ${{ !inputs.skip_bump }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          for pkg in $PUBLISHED_PACKAGES; do
            git add "$pkg/package.json"
          done
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push
          git push origin "v$VERSION"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NODE_AUTH_TOKEN="$(printf '%s' "${NODE_AUTH_TOKEN}" | tr -d '[:space:]')"
          export NODE_AUTH_TOKEN
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "ERROR: GitHub secret NPM_TOKEN is missing or empty for this repository."
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "${HOME}/.npmrc"
          for pkg in $PUBLISHED_PACKAGES; do
            NAME=$(bun -e "console.log(require('./$pkg/package.json').name)")
            VERSION=$(bun -e "console.log(require('./$pkg/package.json').version)")
            if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "Skipping $NAME@$VERSION (already on npm)"
              continue
            fi
            echo "Publishing $pkg ($NAME@$VERSION)"
            bun -e "
              const fs = require('node:fs');
              const file = \`./\${process.argv[1]}/package.json\`;
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
              const strip = (value) => {
                if (!value || typeof value !== 'object' || Array.isArray(value)) return value;
                if ('development' in value) {
                  const { development: _, ...rest } = value;
                  return rest;
                }
                const out = {};
                for (const [key, child] of Object.entries(value)) {
                  out[key] = strip(child);
                }
                return out;
              };
              if (pkg.exports) pkg.exports = strip(pkg.exports);
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\\n');
            " "$pkg"
            npm publish --access public --provenance "./$pkg"
            git checkout -- "$pkg/package.json"
          done

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          bunx git-cliff --latest --strip header > release-notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md
