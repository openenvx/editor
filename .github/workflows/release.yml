name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump for the studio trio
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Version, publish, and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute next version
        id: version
        run: |
          BUMP="${{ inputs.bump }}"
          if git tag -l 'v[0-9]*' | grep -q .; then
            RAW=$(bunx git-cliff --bump "$BUMP" --bumped-version)
            VERSION="${RAW#v}"
          else
            CURRENT=$(bun -e "console.log(require('./packages/html-studio/package.json').version)")
            VERSION=$(bun -e "
              const [maj, min, pat] = process.argv[1].split('.').map(Number);
              const bump = process.argv[2];
              if (bump === 'major') console.log(\`\${maj + 1}.0.0\`);
              else if (bump === 'minor') console.log(\`\${maj}.\${min + 1}.0\`);
              else console.log(\`\${maj}.\${min}.\${pat + 1}\`);
            " "$CURRENT" "$BUMP")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $VERSION"

      - name: Bump studio package versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for pkg in packages/html-studio packages/email-studio packages/canvas-studio; do
            bun -e "
              const fs = require('node:fs');
              const path = process.argv[1];
              const version = process.argv[2];
              const file = path + '/package.json';
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = version;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            " "$pkg" "$VERSION"
          done

      - name: Update changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          bunx git-cliff --tag "v$VERSION" -o CHANGELOG.md

      - name: Commit version bump and tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md packages/html-studio/package.json packages/email-studio/package.json packages/canvas-studio/package.json
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push
          git push origin "v$VERSION"

      - name: Build studio packages
        run: |
          bun run build --filter=@openenvx/html-studio --filter=@openenvx/email-studio --filter=@openenvx/canvas-studio

      - name: Verify publish tarballs
        run: |
          bun run verify-pack:html-studio
          bun run verify-pack:email-studio
          bun run verify-pack:canvas-studio

      - name: Publish to npm
        run: |
          for pkg in packages/html-studio packages/email-studio packages/canvas-studio; do
            echo "Publishing $pkg"
            npm publish --access public --provenance --ignore-scripts "$pkg"
          done

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          bunx git-cliff --latest --strip header > release-notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md
